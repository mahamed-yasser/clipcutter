name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Unit and real-run tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the example edit list
        run: |
          python -m pip install .
          clipcutter --version
          sh examples/make_samples.sh
          clipcutter run examples/edit.json
          clipcutter info examples/reel.mp4
